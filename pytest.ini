[pytest]

testpaths =
    tests

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

addopts =
    -ra
    --strict-markers
    --strict-config

markers =
    unit: Fast tests without external services.
    integration: Tests that require PostgreSQL or application integration.
    api: FastAPI endpoint tests.
    guardrail: Deterministic AI policy and guardrail tests.
    ollama: Tests that require a running local Ollama service.
    docker: Docker or container integration tests.
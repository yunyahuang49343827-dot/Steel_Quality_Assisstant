name: CI


on:

  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop


# =========================================================
# Security
#
# GitHub token receives read-only repository permission.
# =========================================================

permissions:
  contents: read


# =========================================================
# Concurrency
#
# If a newer commit is pushed to the same branch / PR,
# cancel the obsolete CI run.
# =========================================================

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # =======================================================
  # 1. Backend Quality Gate
  # =======================================================

  backend-quality:

    name: Backend Quality Gate

    runs-on: ubuntu-latest

    timeout-minutes: 20


    env:

      APP_ENV: test

      API_HOST: 0.0.0.0
      API_PORT: "8000"

      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: steel_quality_ci
      DB_USER: ci_user
      DB_PASSWORD: ci_password

      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen3.5:9b

      CORS_ORIGINS: http://localhost:5173


    steps:

      # ---------------------------------------------------
      # Repository
      # ---------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # ---------------------------------------------------
      # Python
      # ---------------------------------------------------

      - name: Set up Python 3.12
        uses: actions/setup-python@v7

        with:

          python-version: "3.12"

          cache: "pip"

          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt


      - name: Display Python runtime
        run: |
          python --version
          python -m pip --version


      # ---------------------------------------------------
      # Dependencies
      # ---------------------------------------------------

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt


      # ---------------------------------------------------
      # Static analysis
      # ---------------------------------------------------

      - name: Run Ruff
        run: |
          ruff check src tests


      # ---------------------------------------------------
      # Pytest configuration / collection
      # ---------------------------------------------------

      - name: Validate pytest collection
        run: |
          pytest --collect-only


      # ---------------------------------------------------
      # Deterministic CI-safe tests
      #
      # Excluded:
      # - PostgreSQL integration
      # - Ollama integration
      # - Docker runtime integration
      # ---------------------------------------------------

      - name: Run CI-safe tests
        run: |
          pytest \
            -m "not ollama and not integration and not docker" \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml


      # ---------------------------------------------------
      # Coverage artifact validation
      # ---------------------------------------------------

      - name: Verify coverage report
        run: |
          test -f coverage.xml
          echo "coverage.xml generated successfully"


  # =======================================================
  # 2. Frontend Quality Gate
  # =======================================================

  frontend-quality:

    name: Frontend Quality Gate

    runs-on: ubuntu-latest

    timeout-minutes: 15


    defaults:
      run:
        working-directory: frontend


    steps:

      # ---------------------------------------------------
      # Repository
      # ---------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # ---------------------------------------------------
      # Node.js
      # ---------------------------------------------------

      - name: Set up Node.js 22
        uses: actions/setup-node@v7

        with:

          node-version: "22"

          cache: "npm"

          cache-dependency-path: frontend/package-lock.json


      - name: Display Node runtime
        run: |
          node --version
          npm --version


      # ---------------------------------------------------
      # Deterministic dependency installation
      # ---------------------------------------------------

      - name: Install frontend dependencies
        run: |
          npm ci


      # ---------------------------------------------------
      # Static analysis
      # ---------------------------------------------------

      - name: Run frontend lint
        run: |
          npm run lint


      # ---------------------------------------------------
      # TypeScript + Vite production build
      # ---------------------------------------------------

      - name: Run production build
        run: |
          npm run build


      # ---------------------------------------------------
      # Build artifact validation
      # ---------------------------------------------------

      - name: Verify frontend build artifact
        run: |
          test -d dist
          test -f dist/index.html
          echo "Frontend production build generated successfully"


  # =======================================================
  # 3. PostgreSQL Integration
  # =======================================================

  postgres-integration:

    name: PostgreSQL Integration

    runs-on: ubuntu-latest

    timeout-minutes: 20

    needs:
      - backend-quality


    # -----------------------------------------------------
    # Disposable PostgreSQL service.
    #
    # This is NOT the production database.
    # -----------------------------------------------------

    services:

      postgres:

        image: postgres:17

        env:

          POSTGRES_DB: steel_quality_ci

          POSTGRES_USER: ci_user

          POSTGRES_PASSWORD: ci_password

        ports:

          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U ci_user -d steel_quality_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    env:

      APP_ENV: test

      API_HOST: 0.0.0.0
      API_PORT: "8000"

      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: steel_quality_ci
      DB_USER: ci_user
      DB_PASSWORD: ci_password

      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen3.5:9b

      CORS_ORIGINS: http://localhost:5173


    steps:

      # ---------------------------------------------------
      # Repository
      # ---------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # ---------------------------------------------------
      # Python
      # ---------------------------------------------------

      - name: Set up Python 3.12
        uses: actions/setup-python@v7

        with:

          python-version: "3.12"

          cache: "pip"

          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt


      # ---------------------------------------------------
      # Dependencies
      # ---------------------------------------------------

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt


      # ---------------------------------------------------
      # Real PostgreSQL integration tests
      # ---------------------------------------------------

      - name: Run PostgreSQL integration tests
        run: |
          pytest \
            tests/integration \
            -m "integration and not docker" \
            -v


  # =======================================================
  # 4. Docker Build Validation
  # =======================================================

  docker-build:

    name: Docker Build Validation

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:

      # ---------------------------------------------------
      # Repository
      # ---------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # ---------------------------------------------------
      # Docker Buildx
      # ---------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # ---------------------------------------------------
      # Backend image
      # ---------------------------------------------------

      - name: Build backend Docker image
        uses: docker/build-push-action@v7

        with:

          context: .

          file: ./Dockerfile

          push: false

          tags: steel-quality-backend:ci

          cache-from: type=gha,scope=backend

          cache-to: type=gha,mode=max,scope=backend


      # ---------------------------------------------------
      # Frontend image
      # ---------------------------------------------------

      - name: Build frontend Docker image
        uses: docker/build-push-action@v7

        with:

          context: ./frontend

          file: ./frontend/Dockerfile

          push: false

          tags: steel-quality-frontend:ci

          build-args: |
            VITE_API_BASE_URL=/api

          cache-from: type=gha,scope=frontend

          cache-to: type=gha,mode=max,scope=frontend


  # =======================================================
  # 5. Gateway Integration
  # =======================================================

  gateway-integration:

    name: Gateway Integration

    runs-on: ubuntu-latest

    timeout-minutes: 30

    needs:
      - backend-quality
      - docker-build


    env:

      APP_ENV: docker

      API_HOST: 0.0.0.0
      API_PORT: "8000"

      POSTGRES_DB: steel_quality
      POSTGRES_USER: steel_app
      POSTGRES_PASSWORD: steel_quality_ci

      OLLAMA_MODEL: qwen3.5:9b

      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

      KONG_PROXY_PORT: "8008"

      GATEWAY_BASE_URL: http://localhost:8008

      FRONTEND_BASE_URL: http://localhost:5173


    steps:

      # ---------------------------------------------------
      # Repository
      # ---------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # ---------------------------------------------------
      # Python
      # ---------------------------------------------------

      - name: Set up Python 3.12
        uses: actions/setup-python@v7

        with:

          python-version: "3.12"

          cache: "pip"

          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt


      # ---------------------------------------------------
      # Python dependencies
      # ---------------------------------------------------

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt


      # ---------------------------------------------------
      # Docker runtime
      # ---------------------------------------------------

      - name: Display Docker runtime
        run: |
          docker --version
          docker compose version


      # ---------------------------------------------------
      # Gateway configuration
      # ---------------------------------------------------

      - name: Validate Kong declarative config
        run: |
          docker run \
            --rm \
            -e KONG_DATABASE=off \
            -e KONG_DECLARATIVE_CONFIG=/kong/declarative/kong.yml \
            -v "${PWD}/infra/kong/kong.yml:/kong/declarative/kong.yml:ro" \
            kong:3.9.3 \
            kong config parse \
            /kong/declarative/kong.yml


      # ---------------------------------------------------
      # Full Gateway stack
      #
      # The script:
      # - validates Compose
      # - builds images
      # - starts containers
      # - waits for readiness
      # - runs Gateway pytest
      # - prints logs on failure
      # - destroys temporary stack
      # ---------------------------------------------------

      - name: Run Gateway Docker integration
        run: |
          ./scripts/ci/test_gateway_stack.sh

  # =======================================================
  # 6. Final Quality Gate
  #
  # This provides one stable status check that can later
  # be required by GitHub branch protection.
  # =======================================================



  final-quality-gate:

    name: Final Quality Gate

    runs-on: ubuntu-latest

    timeout-minutes: 5

    if: always()

    needs:
      - backend-quality
      - frontend-quality
      - postgres-integration
      - docker-build
      - gateway-integration


    steps:

      - name: Verify all mandatory CI jobs
        shell: bash

        run: |
          echo "Backend Quality:"
          echo "${{ needs.backend-quality.result }}"

          echo "Frontend Quality:"
          echo "${{ needs.frontend-quality.result }}"

          echo "PostgreSQL Integration:"
          echo "${{ needs.postgres-integration.result }}"

          echo "Docker Build:"
          echo "${{ needs.docker-build.result }}"
          echo "Gateway Integration:"
          echo "${{ needs.gateway-integration.result }}"

          if [[ \
            "${{ needs.backend-quality.result }}" != "success" \
            || "${{ needs.frontend-quality.result }}" != "success" \
            || "${{ needs.postgres-integration.result }}" != "success" \
            || "${{ needs.docker-build.result }}" != "success" \
            || "${{ needs.gateway-integration.result }}" != "success" \
          ]]; then

            echo "One or more mandatory CI jobs failed."

            exit 1

          fi

          echo "All mandatory CI quality gates passed."